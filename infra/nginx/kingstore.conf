# =============================================================================
# Kingstore SaaS — nginx reverse proxy (development profile)
# Production profile gets its own conf with TLS, rate-limit zones, etc.
# =============================================================================

upstream kingstore_app {
    server app:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 25M;

    # Gzip for JSON responses
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain application/javascript text/css;

    # Health check (skip access log noise)
    location = /api/v1/health {
        access_log off;
        proxy_pass http://kingstore_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://kingstore_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 5s;

        # Don't buffer streaming/large responses
        proxy_buffering off;
    }

    # The Next.js frontend will be proxied here in F14.
    location / {
        return 404;
    }
}
